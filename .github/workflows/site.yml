name: Deploy site

# Rebuilds binfera.io (web/, the `binfera` Worker) when a release is published, so the site runs the
# released engine. A manual run deploys the branch or tag picked in the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One deploy at a time, and a newer one never cancels a deploy halfway.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy binfera.io
    # Releases are tagged v*; a pre-release does not replace the live site.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment:
      name: binfera.io
      url: https://binfera.io
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      # pack-rules reads the pinned rules; reference/capa and tests/testfiles are parity-only.
      - name: Fetch pinned rules
        working-directory: .
        run: git submodule update --init --depth 1 rules

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No caches in a deploy workflow: a poisoned cache would ship to the site.
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: wasm32-unknown-emscripten
      # The same Emscripten as the web-engine CI job and local builds.
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: "7.0.0"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev

      - name: Verify pinned source contents
        working-directory: third_party/ghidra
        run: tr -d '\r' < SHA256SUMS | sha256sum -c -

      - run: npm ci
      # Builds the wasm engine from this commit (and fails over the 25 MiB asset limit) and packs the rules.
      - run: npm run prepare-assets
      # The malware demos are never committed: reuse the packed files the live site serves.
      - run: npm run fetch-demos
      - run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          npx wrangler deploy --tag "$sha" --message "$(git log -1 --format=%s) $sha (${GITHUB_REF_NAME})"

      - name: Check the live site
        run: |
          set -euo pipefail
          # The landing page and demo index can reach the edge at different times.
          asset="$(grep -o '/assets/index-[^"]*\.js' dist/index.html | head -1)"
          for attempt in $(seq 1 12); do
            if ! curl -fsS --max-time 10 https://binfera.io/ | grep -F "$asset" >/dev/null; then
              pending="landing page does not reference $asset"
            elif ! curl -fsS --max-time 10 https://binfera.io/demos/index.json | cmp -s - dist/demos/index.json; then
              pending="demo index differs from this build"
            else
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "error: binfera.io $pending" >&2
              exit 1
            fi
            echo "Waiting for binfera.io: $pending"
            sleep 10
          done
          curl -fsS -o /dev/null https://binfera.io/install.sh
          curl -fsS -o /dev/null https://binfera.io/install.ps1
          npm run test:deployment
