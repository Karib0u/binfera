[package]
name = "binfera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust port of capa's rule engine, feature extraction, and result rendering"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
default = []
decompiler = ["dep:binfera-ghidra", "binfera-ghidra/native", "dep:object", "dep:bincode", "serde/rc", "iced-x86/serde"]

[build-dependencies]
flate2 = "1"

[dependencies]
# Optional native FFI is isolated from the unsafe-free analysis library.
binfera-ghidra = { path = "../binfera-ghidra", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"], optional = true }
thiserror = "1"
# YAML parsing for rule ingestion. Chosen over yaml-rust2 because its
# serde_norway::Value (a maintained fork of serde_yaml 0.9) gives us a ready-made generic value tree (mapping/sequence/
# scalar) to walk by hand, matching how build_statements() walks Python dicts.
serde_norway = "0.9"
# Regex compilation for `string: /.../ ` rule features.
regex = "1"
# Fallback for the handful of corpus regexes using lookaround (unsupported by
# `regex`'s finite-automaton engine). Tried only after
# `regex` fails to compile a pattern.
fancy-regex = "0.13"
# `capa0000` freeze files are `zlib(utf-8(json(...)))`; this is
# the standard Rust zlib binding (miniz_oxide backend, no system zlib needed).
flate2 = "1"
# `FeatureSet` must iterate in insertion order to match Python
# dict semantics: `Bytes`/`Substring`/`Regex`.evaluate()`'s short-circuiting
# scan (capa/features/common.py) stops at the *first* qualifying entry in
# iteration order, so a plain HashMap (unspecified order) can pick a
# different match than Python. IndexMap preserves first-insertion order,
# including across repeated `.entry().or_default()` updates.
indexmap = "2"
goblin = "0.10.7"
# The shared x86/x64 decoder. Restrict features to decoding and instruction
# metadata, plus the masm formatter -- instruction-feature extraction needs it
# only for mnemonic text (`extract_insn_mnemonic_features`).
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info", "masm"] }
# FLIRT parsing and matching. The recovery engine remains in-tree; only
# lancelot's standalone signature crate is used.
lancelot-flirt = "0.10.2"
# Required to populate the existing freeze/result sample metadata directly
# from raw file-scope inputs without invoking an external runtime.
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
# CLR metadata/CIL model for the native .NET backend. Vendored,
# not the crates.io release: a security audit found a systemic unchecked-indexing
# panic in upstream 0.5.1's codedindex.rs which is fixed in tree. See third_party/dnfile/PATCH.md.
dnfile = { path = "../third_party/dnfile" }
# The AArch64 decoder for the native ELF backend, chosen
# over yaxpeax-arm and the FFI-based capstone/bad64: #![no_std],
# zero panics across ~2.09M fuzzed/real-code words, recognizes more real
# AArch64 code on the pinned corpus. `full` covers general A64 plus SIMD/FP;
# excludes SVE/SME server-vector extensions out of scope for
# malware corpora.
disarm64 = { version = "0.2.0", default-features = false, features = ["full"] }
# disarm64's own instruction-class enum (InsnClass), used to classify
# control flow -- disarm64 depends on this but does not re-export the type.
disarm64_defn = { version = "0.2.0", default-features = false }
# C++ names (binfera::demangle). Ghidra demangles Itanium names by running GNU binutils, which
# cannot be vendored here. msvc-demangler: LLVM's Microsoft demangler ported to Rust, MIT/NCSA, no
# unsafe code, bitflags and itoa only; malformed names are errors (400,000 mutated names: no panic),
# but its recursion is unbounded, so binfera::demangle bounds the input length.
msvc-demangler = "0.11"
# cpp_demangle: gimli-rs's Itanium demangler (also behind `backtrace`), MIT/Apache-2.0, no
# dependencies, with its own recursion limit; two small unsafe blocks (no panics in the same test).
cpp_demangle = "0.5"
# Rust's maintained demangler: MIT/Apache-2.0, no unsafe code or dependencies, rejects malformed
# symbols, bounds recursion and output; our wrapper also bounds input and rendered allocation.
rustc-demangle = "0.1.27"
# Maintained MIT/Apache DWARF and object readers; bounded slices return parse errors. Only
# read features are enabled; gimli also reads native ELF function starts without the decompiler.
# Decompression and graph allocation are bounded by our debug importer.
# Their internal unsafe slice/endian access stays upstream; our reader is safe Rust.
gimli = { version = "0.32.3", default-features = false, features = ["read", "std"] }
object = { version = "0.37.3", default-features = false, features = ["read", "std"], optional = true }
capstone = { version = "0.14.0", default-features = false, features = ["std", "full", "arch_arm", "arch_mips"] }

[dev-dependencies]
anyhow = "1"
# The analyst-type proof of concept checks what the project store can persist.
binfera-project = { path = "../binfera-project" }
tempfile = "3"
# Snapshot tests for gnarly parsed rules.
insta = "1"

# Function ID development tools need the optional decompiler feature.
[[example]]
name = "fid_truth"
required-features = ["decompiler"]

[[example]]
name = "fid_names"
required-features = ["decompiler"]

[[example]]
name = "fid_pe"
required-features = ["decompiler"]
