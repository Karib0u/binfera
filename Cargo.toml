[workspace]
resolver = "2"
members = ["binfera", "binfera-cli", "binfera-python", "binfera-ghidra", "binfera-project", "binfera-mcp"]
# Vendored dnfile fork (third_party/dnfile/PATCH.md): kept out of
# the workspace so its `cli`-gated bin targets never influence this
# workspace's feature resolution -- binfera depends on it as a plain path
# dependency with dnfile's own default (empty) feature set.
exclude = ["third_party/dnfile", "web/src-tauri", "scripts/decompiler_types/win32_metadata"]

[workspace.package]
version = "1.0.1"
edition = "2021"
# Set by the bundled SQLite: every rusqlite with the fixed libsqlite3-sys (0.39+,
# RUSTSEC-2026-0459) needs 1.89. The code itself last bisected to 1.87 (1.86 fails
# on `is_multiple_of`). CI's `msrv` job builds and tests on exactly this version
# so the floor cannot drift unnoticed.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Karib0u/binfera"

[workspace.lints.rust]
unsafe_code = "forbid"

# The inner development loop (`cargo test`, see docs/development.md)
# is dominated by instruction decoding and flow recovery, which run more than
# an order of magnitude slower unoptimized -- `features_parity` alone spends
# ~75s there versus ~5s optimized. Optimize this crate and its dependencies
# while *keeping* the dev profile's `debug_assertions` and overflow checks
# (which `--release` would turn off), for a few seconds of extra build time.
[profile.dev.package.binfera]
opt-level = 2

# Dependencies only: `"*"` in a profile override never matches workspace
# members, hence the explicit `binfera` entry above.
[profile.dev.package."*"]
opt-level = 2

# Browser engine only; keep native release builds on their existing defaults.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
