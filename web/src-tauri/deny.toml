# cargo-deny policy for the desktop app. It differs from the workspace policy
# (../../deny.toml) in the licences Tauri's dependency tree brings in and in two
# ignored advisories from Tauri's Linux GTK3 stack.

[advisories]
unsound = "all"
yanked = "deny"
# Tauri 2 builds its Linux window on the GTK3 bindings (gtk-rs 0.18), which are no
# longer maintained; only Tauri 3 moves off them.
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by Tauri 2's GTK3 stack; this app never calls VariantStrIter" },
    # A procedural-macro helper of glib-macros and gtk3-macros: build time only.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error runs only at build time, inside the gtk-rs 0.18 macros" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's root certificate list (webpki-root-certs): data, not code.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # cssparser, selectors, dtoa-short, option-ext: unmodified, attributed in NOTICE.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
