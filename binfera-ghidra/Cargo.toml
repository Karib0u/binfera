[package]
name = "binfera-ghidra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Isolated native Ghidra bridge for binfera"

[features]
default = []
native = ["dep:cxx", "dep:cxx-build", "dep:cc", "dep:serde", "dep:libz-sys"]

# This is the only native FFI boundary. Analysis crates still forbid unsafe.
[dependencies]
# CXX generates checked string, slice and ownership bindings and catches C++
# exceptions. Its maintained MIT/Apache-2.0 runtime contains unsafe runtime code.
cxx = { version = "=1.0.180", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# The Windows build has no system zlib to find, so it builds one (the decompiler's .sla compression
# and the SLEIGH compiler both need it). Elsewhere the system zlib is used, as before.
[dev-dependencies]
flate2 = "1"

[target.'cfg(windows)'.dependencies]
libz-sys = { version = "1", default-features = false, features = ["static"], optional = true }

[build-dependencies]
cxx-build = { version = "=1.0.180", optional = true }
# Compile pinned C++ sources and the build-time SLEIGH compiler, without a JVM.
cc = { version = "1", features = ["parallel"], optional = true }
